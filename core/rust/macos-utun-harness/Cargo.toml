[package]
name = "macos-utun-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Developer-only macOS end-to-end harness for meow-ios-ffi — wires a real utun device into the same C-ABI surface the iOS PacketTunnelProvider drives."

[[bin]]
name = "meow-utun"
path = "src/main.rs"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_return = "allow"

[dependencies]
meow-ios-ffi = { path = "../meow-ios-ffi" }
libc = "0.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

# meow-ios-ffi's lwip patch must be repeated here: [patch] sections only
# apply from the manifest of the workspace being built, so without this the
# harness silently resolves UPSTREAM lwip 0.3.15 from crates.io — none of
# the fork's fixes, a different netstack than the one that ships on-device.
# Keep this rev in lockstep with core/rust/meow-ios-ffi/Cargo.toml.
[patch.crates-io]
lwip = { git = "https://github.com/madeye/lwip", rev = "5f6f0dfe025c967157ff328d94efe488852d8755" }
